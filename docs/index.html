<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="XMU Rollcall Helper 的 Safari 快捷指令加密桥接页面。"
    />
    <meta name="theme-color" content="#f5f8ff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>XMU Rollcall Helper</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="content" aria-labelledby="page-title">
        <a
          class="profile-link"
          href="https://github.com/KrsMt-0113"
          aria-label="访问 KrsMt-0113 的 GitHub 主页"
        >
          <img
            class="avatar"
            src="https://avatars.githubusercontent.com/u/174246121?v=4"
            alt="KrsMt-0113 的 GitHub 头像"
            width="104"
            height="104"
            referrerpolicy="no-referrer"
          />
        </a>
        <h1 id="page-title">XMU Rollcall Helper</h1>
        <h2>使用说明</h2>
        <ol class="instructions">
          <li>
            在快捷指令的“详细信息”中开启“在共享表单中显示”，接收类型选择“Safari 浏览器网页”。
          </li>
          <li>使用 Safari 打开本页面，然后点击工具栏中的“共享”按钮。</li>
          <li>在共享表单中选择“XMU Rollcall Helper”。</li>
          <li>按快捷指令中的提示继续操作，等待运行完成。</li>
        </ol>
        <p class="privacy-note">密码加密仅在本机浏览器内完成，不会上传或保存。</p>
      </section>
    </main>

    <form
      id="shortcut-bridge"
      data-state="idle"
      data-encoding="base64"
      hidden
      aria-hidden="true"
    >
      <input id="shortcut-password" name="password" autocomplete="off" />
      <input id="shortcut-salt" name="salt" autocomplete="off" />
      <button id="shortcut-encrypt" type="button">Encrypt</button>
      <output id="shortcut-output" name="result"></output>
    </form>
  </body>
</html>
